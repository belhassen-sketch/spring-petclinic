apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: petclinic-ci
spec:
  params:
    - name: git-revision
      type: string
      default: main
  tasks:
    - name: build
      taskSpec:
        steps:
          - name: s2i-build
            image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
            script: |
              #!/bin/bash
              set -e
              echo ">>> Building revision $(params.git-revision)"
              oc start-build petclinic --commit=$(params.git-revision) --wait --follow

    - name: deploy
      runAfter: [build]
      taskSpec:
        steps:
          - name: rollout
            image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
            script: |
              #!/bin/bash
              sleep 15   # give the image trigger time to start the rollout
              if ! oc rollout status deployment/petclinic --timeout=4m; then
                echo ">>> Rollout FAILED - rolling back automatically"
                oc rollout undo deployment/petclinic
                oc rollout status deployment/petclinic --timeout=4m
                exit 1
              fi
              echo ">>> Rollout succeeded"

    - name: smoke-test
      runAfter: [deploy]
      taskSpec:
        steps:
          - name: health
            image: registry.access.redhat.com/ubi9/ubi-minimal
            script: |
              #!/bin/bash
              for i in $(seq 1 10); do
                if curl -sf http://petclinic:8080/actuator/health/readiness; then
                  echo; echo ">>> Smoke test passed"; exit 0
                fi
                sleep 3
              done
              echo ">>> Smoke test FAILED"; exit 1
